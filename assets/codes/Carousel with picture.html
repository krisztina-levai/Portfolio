<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rise Carousel</title>

  <style>
    :root{
      --bg: #fff;
      --text: #0b0b0b;

      /* Layout */
      --maxW: 1320px;
      --outerPadY: 26px;
      --outerPadX: 26px;

      /* Left image card */
      --imgW: 470px;
      --imgH: 430px;
      --imgRadius: 44px;
      --shadow: 0 10px 15px rgba(0,0,0,.14);

      /* Right side */
      --rightMaxW: 760px;
      --gap: 56px;

      /* Typography */
      --quoteSize: 20px;
      --quoteLH: 30px;

      /* Buttons */
      --btnW: 560px;
      --btnFont: 13px;
      --btnPY: 18px;
      --btnPX: 34px;

      /* Nav */
      --navSize: 68px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .wrap{
      max-width: var(--maxW);
      margin: 0 auto;
      padding: var(--outerPadY) var(--outerPadX);
    }

    /* The whole module */
    .module{
      position: relative;
      padding: 8px 86px; /* gutters so arrows sit outside content */
    }

    .carousel{
      display: grid;
      grid-template-columns: var(--imgW) 1fr;
      gap: var(--gap);
      align-items: stretch;  /* IMPORTANT for dot positioning + equal heights */
      margin-left: 15px;
      margin-right: 15px;
    }

    /* Constant image */
    .left{
      width: var(--imgW);
      height: var(--imgH);
      border-radius: var(--imgRadius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #f2f2f2;
    }
    .left img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      object-position: center -80px;
    }

    /* Right (changing) */
    .right{
      max-width: var(--rightMaxW);
      height: var(--imgH);           /* KEY: match image height so dots sit at bottom */
      display: flex;
      flex-direction: column;
      align-self: stretch;
      align-items: center;           /* center group horizontally */
    }

    /* Centers quote+buttons vertically, while allowing dots to stay at bottom */
    .rightInner{
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;           /* vertical center */
      justify-content: center;       /* horizontal center */
    }

    /* Constrain content so centering actually works */
    #content{
      width: min(680px, 100%);
      margin: 0 auto;
    }

    .quote{
      font-size: var(--quoteSize);
      line-height: var(--quoteLH);
      letter-spacing: -0.02em;
      margin: 0 0 28px 0;
      font-weight: 500;
      width: 100%;
    }
    .quote strong{ font-weight: 800; }

    .actions{
      display:flex;
      flex-direction:column;
      gap: 18px;
      width: min(var(--btnW), 100%);
      margin: 0 auto;               /* centers the button block */
      align-items: center;
    }

    .pill{
      width: 100%;
      max-width: 360px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#000;
      color:#fff;
      text-decoration:none;
      border-radius: 999px;
      padding: var(--btnPY) var(--btnPX);
      font-size: var(--btnFont);
      font-weight: 500;
      border: none;
      cursor:pointer;
      text-align:center;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      white-space: normal;        /* allow wrapping */
overflow-wrap: anywhere;    /* breaks long chunks safely */
word-break: break-word;     /* extra safety */
line-height: 1.2;           /* optional, looks nicer when wrapped */

    }
    .pill:focus{
      outline: 3px solid rgba(0,0,0,.25);
      outline-offset: 3px;
    }

    /* Nav arrows */
    .navBtn{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      width: var(--navSize);
      height: var(--navSize);
      border-radius: 999px;
      border: none;
      background:#000;
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow: 0 14px 28px rgba(0,0,0,.18);
      z-index: 2;
    }
    .navBtn svg{ width: 20px; height: 20px; }
    .navBtn.leftBtn{ left: 16px; }
    .navBtn.rightBtn{ right: 16px; }

    /* Hide arrows when not applicable (looping: only hide if 1 slide) */
    .navBtn.isHidden{
      opacity: 0;
      pointer-events: none;
    }

    /* Dots fixed at bottom of right column */
    .dots{
      display:flex;
      justify-content:center;
      gap: 10px;
      padding: 18px 0 6px;
      width: min(var(--btnW), 100%);
      margin-top: auto;              /* pushes dots to bottom */
    }
    .dot{
      width: 34px;
      height: 10px;
      border-radius: 999px;
      background: #cfcfcf;
      border: none;
      cursor:pointer;
    }
    .dot.active{ background:#000; }

    /* Fade */
    .fade{
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .fade.show{
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 1060px){
      :root{
        --imgW: 410px;
        --imgH: 390px;
        --btnW: 520px;
      }
    }
    @media (max-width: 820px){
      .module{ padding: 8px 18px; }
      .navBtn{ display:none; }
      .carousel{
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .left{
        width: 100%;
        height: 320px;
      }
      .right{
        height: auto;               /* allow natural height on mobile */
        min-height: 0;
      }
      .actions, .dots{ width: 100%; }
      .pill{ width: 100%; white-space: normal; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="module" aria-label="Quote carousel">
      <button class="navBtn leftBtn" id="prevBtn" aria-label="Previous slide" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="navBtn rightBtn" id="nextBtn" aria-label="Next slide" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="carousel">
        <!-- Constant image -->
        <div class="left" aria-hidden="true">
          <img
            src="https://images.netexam.com/images/11356/three-collegues-working-car-showroom.jpg"
            alt=""
          />
        </div>

        <!-- Changing content -->
        <div class="right">
          <div class="rightInner">
            <div id="content" class="fade show">
              <p class="quote" id="quote"></p>
              <div class="actions" id="actions"></div>
            </div>
          </div>
          <div class="dots" id="dots" aria-label="Slide dots"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Slides (right side only)
    const SLIDES = [
      {
        quoteHtml:
          '“Start with the <strong>Vantage Fundamentals</strong> course so you understand the platform and core concepts, then move to the <strong>Vantage Intermediate</strong> course if you want a deeper technical view.”',
        buttons: [
          { label: "Vantage Fundamentals", href: "https://university-catalog.abbyy.com/Course/131728/abbyy-vantage-fundamentals" },
          { label: "Vantage Intermediate", href: "https://university-catalog.abbyy.com/Course/132780/abbyy-vantage-intermediate" }
        ]
      },
      {
        quoteHtml:
          '“If you want the most structured path, follow the <strong>Business Analyst Learning Plan</strong>—it lays out the recommended sequence and builds toward certification.”',
        buttons: [
          { label: "Business Analyst Learning Plan", href: "https://university-catalog.abbyy.com/LP/955/abbyy-vantage-certified-business-analyst-learning-plan" }
        ]
      }
    ];

    const quoteEl   = document.getElementById("quote");
    const actionsEl = document.getElementById("actions");
    const dotsEl    = document.getElementById("dots");
    const contentEl = document.getElementById("content");
    const prevBtn   = document.getElementById("prevBtn");
    const nextBtn   = document.getElementById("nextBtn");

    let idx = 0;

    function updateArrows(){
      // Looping carousel: arrows are only NOT applicable if there's 0/1 slide.
      const shouldShow = SLIDES.length > 1;
      prevBtn.classList.toggle("isHidden", !shouldShow);
      nextBtn.classList.toggle("isHidden", !shouldShow);
    }

    function renderDots() {
      dotsEl.innerHTML = "";
      SLIDES.forEach((_, i) => {
        const b = document.createElement("button");
        b.className = "dot" + (i === idx ? " active" : "");
        b.type = "button";
        b.setAttribute("aria-label", `Go to slide ${i + 1}`);
        b.addEventListener("click", () => goTo(i));
        dotsEl.appendChild(b);
      });
    }

    function renderSlide() {
      const slide = SLIDES[idx];

      // start fade out
      contentEl.classList.remove("show");
      contentEl.classList.add("fade");

      window.setTimeout(() => {
        // quote
        quoteEl.innerHTML = slide.quoteHtml;

        // buttons
        actionsEl.innerHTML = "";
        slide.buttons.forEach(btn => {
          const a = document.createElement("a");
          a.className = "pill";
          a.textContent = btn.label;
          a.href = btn.href || "#";
          a.target = "_blank";
          a.rel = "noopener";
          actionsEl.appendChild(a);
        });

        // dots + arrows
        renderDots();
        updateArrows();

        // fade in
        contentEl.classList.add("show");
      }, 160);
    }

    // Looping navigation
    function goTo(newIdx) {
      idx = (newIdx + SLIDES.length) % SLIDES.length;
      renderSlide();
    }

    prevBtn.addEventListener("click", () => goTo(idx - 1));
    nextBtn.addEventListener("click", () => goTo(idx + 1));

    // Keyboard support (optional)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goTo(idx - 1);
      if (e.key === "ArrowRight") goTo(idx + 1);
    });

    // Init
    renderSlide();
  </script>
</body>
</html>
